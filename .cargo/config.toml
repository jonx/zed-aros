[build]
# v0 mangling scheme provides more detailed backtraces around closures
rustflags = ["-C", "symbol-mangling-version=v0", "--cfg", "tokio_unstable"]

[alias]
xtask = "run --package xtask --"
perf-test = ["test", "--profile", "release-fast", "--lib", "--bins", "--tests", "--all-features", "--config", "target.'cfg(true)'.runner='cargo run -p perf --release'", "--config", "target.'cfg(true)'.rustflags=[\"--cfg\", \"perf_enabled\"]"]
# Keep similar flags here to share some ccache
perf-compare = ["run", "--profile", "release-fast", "-p", "perf", "--config", "target.'cfg(true)'.rustflags=[\"--cfg\", \"perf_enabled\"]", "--", "compare"]

[target.'cfg(target_os = "windows")']
rustflags = [
    "--cfg",
    "windows_slim_errors",        # This cfg will reduce the size of `windows::core::Error` from 16 bytes to 4 bytes
    "-C",
    "target-feature=+crt-static", # This fixes the linking issue when compiling livekit on Windows
]

# We need lld to link libwebrtc.a successfully on aarch64-linux
[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

# AROS (hosted on darwin-aarch64). Target rustflags replace [build] rustflags,
# so the shared flags are repeated here. aarch64-unknown-aros has no getrandom
# backend upstream; select the "custom" backend (the final binary provides
# __getrandom_v03_custom over posixc arc4random_buf).
[target.aarch64-unknown-aros]
rustflags = [
    "-C", "symbol-mangling-version=v0",
    "--cfg", "tokio_unstable",
    "--cfg", 'getrandom_backend="custom"',
]

[env]
MACOSX_DEPLOYMENT_TARGET = "10.15.7"
# C code built by cc-rs for the AROS target must follow the AROS C recipe:
# host clang, ELF target triple, large code model, x18 reserved (this code
# runs inside AROS processes), AROS SDK headers from the canonical
# /Users/jkn/aros-build tree. The target-suffixed env names keep host builds
# unaffected.
CC_aarch64_unknown_aros = "clang"
# Apple ar silently produces empty archives from ELF objects; use llvm-ar.
AR_aarch64_unknown_aros = "/Users/jkn/aros-crosstools/bin/llvm-ar"
# posixc before stdc: POSIX programs resolve <time.h>/<unistd.h> to posixc
# (which layers over stdc); that is where localtime_r etc. live.
CFLAGS_aarch64_unknown_aros = "--target=aarch64-unknown-none-elf -fno-pic -mcmodel=large -ffixed-x18 -D__arm64__ -O2 -I/Users/jkn/aros-build/bin/darwin-aarch64/gen/include -I/Users/jkn/aros-build/bin/darwin-aarch64/gen/include/aros/posixc -I/Users/jkn/aros-build/bin/darwin-aarch64/gen/include/aros/stdc -I/Users/jkn/aros-build/bin/darwin-aarch64/AROS/Developer/include"
