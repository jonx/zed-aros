[package]
name = "gpui_aros"
version = "0.1.0"
publish.workspace = true
edition.workspace = true
license = "Apache-2.0"

[lints]
workspace = true

[lib]
path = "src/gpui_aros.rs"

# Host-compilable core (atlas / renderer / input) — the porting
# conformance suite runs these under plain `cargo test -p gpui_aros`
# on any host (see PORTING.md).
[dependencies]
gpui.workspace = true
anyhow.workspace = true
collections.workspace = true
etagere = "0.2"
parking_lot.workspace = true
tiny-skia = "0.11"

# AROS-only shell (window / platform / dispatcher / text).
[target.'cfg(target_os = "aros")'.dependencies]
gpui_wgpu.workspace = true
crossbeam-channel = "0.5"
futures.workspace = true
log.workspace = true
smallvec.workspace = true
util.workspace = true
uuid.workspace = true
raw-window-handle = "0.6"

[build-dependencies]
cc = "1"
