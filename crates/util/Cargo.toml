[package]
name = "util"
version = "0.1.0"
edition.workspace = true
publish = false
license = "Apache-2.0"
description = "A collection of utility structs and functions used by Zed and GPUI"


[lints]
workspace = true

[lib]
path = "src/util.rs"
doctest = true

[features]
default = ["process"]
# Host subprocesses + archive extraction: the `archive`, `command`, `process`,
# `shell_env` and `shell_builder` modules, which run on `smol` and therefore
# pull the async-io reactor. On by default, so every zed crate keeps them
# without touching its manifest. Off for embedders that only want util's pure
# helpers — notably gpui, whose `http_client` dep takes `default-features =
# false`; that keeps the reactor out of a downstream app's graph entirely
# (it was dragging ~20 vendor-aros crates into Ferail's AROS build).
process = ["dep:smol"]
test-support = ["rand", "util_macros"]

[dependencies]
anyhow.workspace = true
async_zip.workspace = true
collections.workspace = true
dunce.workspace = true
futures-lite.workspace = true
futures.workspace = true
globset.workspace = true
itertools.workspace = true
log.workspace = true
rand = { workspace = true, optional = true }
regex.workspace = true
rust-embed.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_json_lenient.workspace = true
shlex.workspace = true
take-until.workspace = true
tempfile.workspace = true
unicase.workspace = true
url.workspace = true
percent-encoding.workspace = true
util_macros = { workspace = true, optional = true }
gpui_util.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
async-fs.workspace = true
walkdir.workspace = true
# `smol` pulls the whole async-io reactor (polling -> rustix -> errno). It
# compiles on AROS now via vendor-aros, and zed wants it, but it is optional so
# an embedder that only needs gpui can leave it out entirely — see the
# `process` feature.
smol = { workspace = true, optional = true }

# `dirs`/`which` assume a unix/windows model and don't exist on AROS. Their only
# callers are the process/archive/shell modules (gated off in util.rs for aros)
# and a HOME-based path fallback (paths.rs), so keep them off the AROS graph.
[target.'cfg(all(not(target_family = "wasm"), not(target_os = "aros")))'.dependencies]
dirs.workspace = true
which.workspace = true

[target.'cfg(unix)'.dependencies]
command-fds = "0.3.1"
libc.workspace = true
nix = { workspace = true, features = ["user"] }

[target.'cfg(target_os = "macos")'.dependencies]
mach2.workspace = true

[target.'cfg(windows)'.dependencies]
tendril = "0.4.3"

[dev-dependencies]
rand.workspace = true
util_macros.workspace = true
pretty_assertions.workspace = true
