# zed_aros_app -- minimal AROS entry point that boots editor-core.
#
# Built as a staticlib for aarch64-unknown-aros (-Zbuild-std) and linked into a
# runnable AROS binary by hosted/zed/build.sh (collect-aros + startup.o + the
# std pal glue, same recipe as hosted/feraille). networking/wasm/terminal are
# stubbed in the vendored crates; this crate stands up a gpui Workspace on the
# AROS platform backend (editor tabs + file tree + status bar).
[package]
name = "zed_aros_app"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
gpui.workspace = true
gpui_platform.workspace = true
editor.workspace = true
language.workspace = true
lsp.workspace = true
multi_buffer.workspace = true
settings.workspace = true
theme.workspace = true
theme_settings.workspace = true
release_channel.workspace = true
workspace.workspace = true
project.workspace = true
client.workspace = true
node_runtime.workspace = true
fs.workspace = true
db.workspace = true
clock.workspace = true
go_to_line.workspace = true
project_panel.workspace = true
# NOTE: language_selector (the language status item) is still deferred -- it
# pulls ... -> prompt_store -> heed -> LMDB (POSIX calls AROS lacks). project_panel
# (file tree) is back: its git_ui dependency (the only heed path) is now
# non-AROS-only, gated off on AROS.
# The bundled tree-sitter grammars + language configs/queries (load-grammars
# compiles the grammar C). We register languages from `grammars` directly rather
# than via the `languages` crate, which pulls the LSP adapters (node tooling +
# Microsoft's 25-crate `pet` python suite) -- none of which is usable while LSP
# is OS-gated, and much of which lacks an AROS arm.
grammars = { workspace = true, features = ["load-grammars"] }
# FakeHttpClient (networking is stubbed) and Session::test come from these
# crates' test-support features; the fake HTTP client is the right "no network"
# backing for a Client here.
http_client = { workspace = true, features = ["test-support"] }
session = { workspace = true, features = ["test-support"] }
log.workspace = true
semver.workspace = true
uuid.workspace = true
anyhow.workspace = true
async-trait.workspace = true
# The hidden `--nettest` async smoke test (verifies the unified-fd shim +
# reactor Phase B drive real sockets).
async-io = "2.6"
futures-lite = "2"
# Custom getrandom backends (arc4random_buf) for the AROS target; see
# getrandom_aros.rs. 0.3/0.4 share the v03 hook via --cfg getrandom_backend.
getrandom = "0.4"
getrandom02 = { package = "getrandom", version = "0.2", features = ["custom"] }

[profile.release]
panic = "abort"
