[package]
name = "livekit_api"
version = "0.1.0"
edition.workspace = true
description = "SDK for the LiveKit server API"
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/livekit_api.rs"
doctest = false

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
log.workspace = true
prost.workspace = true
prost-types.workspace = true
reqwest.workspace = true
serde.workspace = true

[build-dependencies]
prost-build.workspace = true

[package.metadata.cargo-machete]
ignored = ["prost-types"]

# aws-lc-rs is a C library that does not build for AROS; jsonwebtoken's
# pure-Rust backend provides the same JWT signing there.
[target.'cfg(not(target_os = "aros"))'.dependencies]
jsonwebtoken = { workspace = true, features = ["aws_lc_rs"] }

[target.'cfg(target_os = "aros")'.dependencies]
jsonwebtoken = { workspace = true, features = ["rust_crypto"] }

