[package]
name = "http_client"
version = "0.1.0"
edition.workspace = true
publish = false
license = "Apache-2.0"
description = "A HTTP client library for Zed and GPUI"

[lints]
workspace = true

[features]
default = ["github-download"]
# Downloading + extracting GitHub release archives (the `github_download`
# module). It is the only user of `async-tar` and of util's archive helpers,
# and through them of the async-io reactor, so it is a feature rather than
# unconditional: gpui takes this crate with `default-features = false`, which
# keeps that whole stack out of an embedder's graph. Every zed crate that
# depends on http_client directly still gets it by default.
github-download = ["dep:async-tar", "util/process"]
test-support = []

[lib]
path = "src/http_client.rs"
doctest = true

[dependencies]
anyhow.workspace = true
async-compression.workspace = true
bytes.workspace = true
derive_more.workspace = true
futures.workspace = true
http-body.workspace = true
http.workspace = true
log.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_urlencoded.workspace = true
url.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
# Pure helpers only; the `github-download` feature turns util's `process` half
# back on when it is enabled. Spelled out rather than inherited from the
# workspace because cargo forbids a member from overriding an inherited
# `default-features`, and flipping it workspace-wide would strip the process
# modules from all 31 crates that use them.
util = { path = "../util", default-features = false }
async-fs.workspace = true
sha2.workspace = true
tempfile.workspace = true
async-tar = { workspace = true, optional = true }
