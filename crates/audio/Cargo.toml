[package]
name = "audio"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/audio.rs"
doctest = false

[dependencies]
anyhow.workspace = true
collections.workspace = true
cpal.workspace = true
crossbeam.workspace = true
gpui.workspace = true
log.workspace = true
parking_lot.workspace = true
rodio.workspace = true
serde.workspace = true
settings.workspace = true
thiserror.workspace = true
util.workspace = true

[target.'cfg(not(any(all(target_os = "windows", target_env = "gnu"), target_os = "freebsd")))'.dependencies]

# libwebrtc brings in the C++ WebRTC SDK (via cxx), which does not build for
# AROS; the echo canceller falls back to its stub implementation there.
[target.'cfg(not(target_os = "aros"))'.dependencies]
libwebrtc.workspace = true
